name: Docs

# This repository holds documentation and its CI tooling. The workflow checks
# links, scans for secrets and tests verification before installing CI tools.
on:
  push:
  workflow_dispatch:
  # **NO `pull_request` TRIGGER, WHICH MATTERS ONCE THIS REPOSITORY IS PUBLIC.** A public repository
  # lets anyone open a pull request, and a fork's pull request would then spend runner time on
  # attacker-supplied Markdown. No step here interpolates `github.event.*` into a shell argument, so
  # there is no injection sink, but free compute for strangers buys this repository nothing. The same
  # rule holds in sdwa5-3d and sdwa5-vps.
  # External URLs are checked weekly rather than per push. They fail for
  # reasons that have nothing to do with the commit — rate limits, a site
  # being briefly down — and a check that cries wolf gets ignored. Weekly
  # rather than nightly, because link rot is slow and every red run mails: in
  # 20 nightly runs up to 2026-10-05 the job found no dead external link, and
  # its only red run was a missing sibling exclude, which a week also catches.
  #
  # **THE TIME BELOW IS A REQUEST AND NOT A PROMISE, AND THE DIFFERENCE IS LARGE ENOUGH TO CONFUSE
  # SOMEBODY READING THEIR INBOX.** GitHub queues `schedule` events and runs them when capacity
  # allows, so a scheduled job arrives at an hour nobody asked for and is dropped entirely under load.
  # Measured on run 34830869821: requested 04:23 UTC, started 09:59 UTC, which is 5 h 36 m late. That
  # is normal for this trigger and there is no setting that tightens it. So a failure mail from this
  # workflow carries no information about the time of day it names, and a missing week is not
  # evidence that anything broke.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

# Public siblings are required for the offline link check. The external job
# excludes their local paths because it does not clone them.
env:
  SIBLINGS: sdwa5-vps sdwa5-3d sdwa5-dsp
  LYCHEE_VERSION: '0.24.2'
  LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a

# **A superseded push should stop costing money the moment it is superseded.** This repository's runs are cheap,
# well under a minute, so the saving here is small — it is in place because the rule should be the same in all
# three SdWa5 repositories rather than because this one is expensive. `sdwa5-3d` is where it pays for itself.
#
# **`cancel-in-progress` is off on `main` on purpose.** A merge commit's green run is the thing a release is
# judged by, and cancelling it because the next merge landed is how a branch ends up with no completed run at all.
# The weekly external link check runs on `main`, so this is also what stops a push cancelling it mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test CI tool download verification
        run: python3 -B -m unittest discover -s .github/tests -v

  # Relative links and their #anchors, resolved against the filesystem.
  #
  # The sub-repositories are separate repositories that merely sit in
  # subdirectories on disk, and this repository gitignores both. So a link like
  # `../sdwa5-vps/docs/caddy.md` cannot be resolved from a checkout of this
  # repository alone, which is the silent breakage this job exists to catch.
  links:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes. That default is what let `sdwa5-3d`'s `full` job burn roughly 1644 minutes
    # across three nightly runs before anybody saw a log, because a job cancelled at the ceiling reports only that
    # it was cancelled. An offline link check over a few dozen Markdown files is seconds.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Clone the required public siblings without credentials
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
        run: |
          for dir in $SIBLINGS; do
            git -c credential.helper= -c http.extraheader= clone --depth 1 --no-tags \
              "https://github.com/SdWa5/${dir#sdwa5-}.git" "$dir"
          done

      - name: Install checksum-verified lychee
        run: |
          bash .github/scripts/install-ci-tool.sh \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            "$LYCHEE_SHA256" lychee-x86_64-unknown-linux-gnu/lychee "$RUNNER_TEMP/lychee"

      - name: Check relative links and anchors
        run: |
          "$RUNNER_TEMP/lychee" --offline --include-fragments --config lychee.toml \
            './*.md' './docs/**/*.md'

  # The same files, with external URLs actually fetched. Weekly and on demand.
  links-external:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Network-bound and the slowest job here, since it actually fetches every external URL. lychee's own
    # `max_retries = 3` and `timeout = 20` in lychee.toml bound a single link; this bounds the job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install checksum-verified lychee
        run: |
          bash .github/scripts/install-ci-tool.sh \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            "$LYCHEE_SHA256" lychee-x86_64-unknown-linux-gnu/lychee "$RUNNER_TEMP/lychee"

      - name: Check external links
        env:
          # Public GitHub link checks retain the existing read-only API token.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          exclude=()
          for dir in $SIBLINGS; do
            exclude+=(--exclude "$dir")
          done
          "$RUNNER_TEMP/lychee" --include-fragments --config lychee.toml \
            "${exclude[@]}" './*.md' './docs/**/*.md'

  # Secret scanning, on the working tree and on the full history.
  #
  # The gitleaks CLI is used directly rather than gitleaks/gitleaks-action,
  # because that action requires a paid-tier licence key for repositories owned
  # by a GitHub Organization, and moving these repositories into an `sdwa5`
  # organization is the plan. The CLI itself is MIT and needs no key.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # The history scan needs the history.
          fetch-depth: 0

      - name: Install checksum-verified gitleaks
        run: |
          bash .github/scripts/install-ci-tool.sh \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "$GITLEAKS_SHA256" gitleaks "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the working tree
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --config .gitleaks.toml'

      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --config .gitleaks.toml'
