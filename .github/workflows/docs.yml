name: Docs

# This repository holds no code. What it can get wrong is a link, and what it
# must never publish is a secret, so those are the two things CI checks.
on:
  push:
  workflow_dispatch:
  # **NO `pull_request` TRIGGER, WHICH MATTERS ONCE THIS REPOSITORY IS PUBLIC.** A public repository
  # lets anyone open a pull request, and a fork's pull request would then spend runner time on
  # attacker-supplied Markdown. No step here interpolates `github.event.*` into a shell argument, so
  # there is no injection sink, but free compute for strangers buys this repository nothing. The same
  # rule holds in sdwa5-3d and sdwa5-vps.
  # External URLs are checked nightly rather than per push. They fail for
  # reasons that have nothing to do with the commit — rate limits, a site
  # being briefly down — and a check that cries wolf gets ignored.
  #
  # **THE TIME BELOW IS A REQUEST AND NOT A PROMISE, AND THE DIFFERENCE IS LARGE ENOUGH TO CONFUSE
  # SOMEBODY READING THEIR INBOX.** GitHub queues `schedule` events and runs them when capacity
  # allows, so a nightly job arrives at an hour nobody asked for and is dropped entirely under load.
  # Measured on run 34830869821: requested 04:23 UTC, started 09:59 UTC, which is 5 h 36 m late. That
  # is normal for this trigger and there is no setting that tightens it. So a failure mail from this
  # workflow carries no information about the time of day it names, and a missing night is not
  # evidence that anything broke.
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

# **A superseded push should stop costing money the moment it is superseded.** This repository's runs are cheap,
# well under a minute, so the saving here is small — it is in place because the rule should be the same in all
# three SdWa5 repositories rather than because this one is expensive. `sdwa5-3d` is where it pays for itself.
#
# **`cancel-in-progress` is off on `main` on purpose.** A merge commit's green run is the thing a release is
# judged by, and cancelling it because the next merge landed is how a branch ends up with no completed run at all.
# The nightly external link check runs on `main`, so this is also what stops a push cancelling it mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Relative links and their #anchors, resolved against the filesystem.
  #
  # The sub-repositories are separate repositories that merely sit in
  # subdirectories on disk, and this repository gitignores both. So a link like
  # `../sdwa5-vps/docs/caddy.md` cannot be resolved from a checkout of this
  # repository alone, which is the silent breakage this job exists to catch.
  links:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes. That default is what let `sdwa5-3d`'s `full` job burn roughly 1644 minutes
    # across three nightly runs before anybody saw a log, because a job cancelled at the ceiling reports only that
    # it was cancelled. An offline link check over a few dozen Markdown files is seconds.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Cloning a private sibling needs a token this repository does not have
      # by default. Both steps therefore tolerate failure, and the next step
      # tells lychee to skip whatever is missing rather than call it broken.
      # Once the repositories are public, no token is needed and both succeed.
      - uses: actions/checkout@v5
        id: vps
        continue-on-error: true
        with:
          repository: SdWa5/vps
          path: sdwa5-vps
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}

      - uses: actions/checkout@v5
        id: three_d
        continue-on-error: true
        with:
          repository: SdWa5/3d
          path: sdwa5-3d
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}

      - name: Decide which sibling repositories can be validated
        id: siblings
        run: |
          skip=''
          for dir in sdwa5-vps sdwa5-3d; do
            # **`-d "$dir/.git"` WAS THE WRONG TEST AND IT MADE THIS JOB RED THE FIRST TIME IT EVER RAN.**
            # `actions/checkout` creates the directory and initialises `.git` *before* it fetches, so a
            # checkout that fails leaves both behind with no files under them. Both siblings therefore
            # reported "checked out", nothing was excluded, and lychee called 60 working links broken.
            # Measured on run 34700494948: the checkouts failed with "Not Found" because this repository's
            # `GITHUB_TOKEN` cannot read a sibling repository, not even inside the same organization.
            # A commit is the thing worth testing for, since only a fetch that succeeded produces one.
            if git -C "$dir" rev-parse --verify HEAD >/dev/null 2>&1; then
              echo "::notice::$dir is checked out, links into it will be validated"
            else
              echo "::warning::$dir could not be cloned, so links into it are SKIPPED rather than checked. Add a SIBLING_REPOS_TOKEN secret with read access, or make the repository public."
              # **NO TRAILING SLASH, BECAUSE `--exclude` IS A REGULAR EXPRESSION AND NOT A PATH PREFIX.**
              # `README.md` and `CHANGELOG.md` link to the sibling *directories* themselves, as
              # `[`sdwa5-3d`](sdwa5-3d)`, so the URI lychee resolves ends at the directory name with no
              # slash after it. `sdwa5-3d/` therefore matched `sdwa5-3d/docs/caddy.md` and missed the bare
              # link, which is what made `links-external` red on run 34830869821. `sdwa5-3d` matches both.
              skip="$skip --exclude $dir"
            fi
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          # --offline resolves file paths and anchors without touching the
          # network, which is what a per-push run should do. The nightly
          # external job below drops it.
          args: >-
            --offline
            --include-fragments
            --config lychee.toml
            ${{ steps.siblings.outputs.skip }}
            './*.md' './docs/**/*.md'
          fail: true

  # The same files, with external URLs actually fetched. Nightly and on demand.
  links-external:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Network-bound and the slowest job here, since it actually fetches every external URL. lychee's own
    # `max_retries = 3` and `timeout = 20` in lychee.toml bound a single link; this bounds the job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --include-fragments
            --config lychee.toml
            --exclude sdwa5-vps --exclude sdwa5-3d
            './*.md' './docs/**/*.md'
          fail: true

  # Secret scanning, on the working tree and on the full history.
  #
  # The gitleaks CLI is used directly rather than gitleaks/gitleaks-action,
  # because that action requires a paid-tier licence key for repositories owned
  # by a GitHub Organization, and moving these repositories into an `sdwa5`
  # organization is the plan. The CLI itself is MIT and needs no key.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          # The history scan needs the history.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan the working tree
        run: /tmp/gitleaks dir . --redact --no-banner --config .gitleaks.toml

      - name: Scan the full history
        run: /tmp/gitleaks git . --redact --no-banner --config .gitleaks.toml
