# Secret scanning configuration for the SdWa5 root repository.
#
# Extends the upstream rule set rather than replacing it, so new rules arrive
# with a gitleaks upgrade instead of having to be copied in here.
[extend]
useDefault = true

[allowlist]
description = "Paths this repository does not own and does not publish"

paths = [
  # sdwa5-vps and sdwa5-3d are separate repositories that only sit in
  # subdirectories on disk, and this repository gitignores both. They run this
  # same scan in their own CI, so scanning them from here would report another
  # repository's findings against this one's commits.
  '''^sdwa5-vps/''',
  '''^sdwa5-3d/''',
]

# **`.idea/` is scanned rather than allowlisted, and that is a deliberate
# reversal.** It used to carry a blanket `^\.idea/` entry so PhpStorm's shared
# inspection profile would not trip the high-entropy rules. Measured on
# 2026-09-13: every tracked file under `.idea/` and every `.idea/` path that has
# ever held a blob in this repository's history is clean, so the allowlist was
# buying nothing. What it cost is the one directory that classically carries a
# credential — `dataSources.xml` holds database connection strings and
# `webServers.xml` holds FTP and SSH logins, and PhpStorm writes both without
# being asked. An allowlist there would have hidden exactly the file worth
# finding. `.idea/.gitignore` already excludes `/dataSources/` and
# `/dataSources.local.xml`; this makes the scanner the backstop rather than the
# gitignore alone.
